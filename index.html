<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confra Year 4</title>
<meta name="description" content="Confirme a presença da sua família na confraternização de fim de ano do Year 4.">
<meta property="og:title" content="Confra de fim de ano · Year 4 2026">
<meta property="og:description" content="Segunda, 30/11, às 18h. Confirme quantas pessoas vão.">
<meta name="theme-color" content="#4A0D15">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: the class-photo sheet. Burgundy ground with soft bokeh lights,
   pale rounded "photo frames" for every block, white handwritten captions under them. */
:root {
  --wine: #4A0D15;
  --wine-deep: #2E070C;
  --glow: #E8343B;
  --frame: #E9EFF1;
  --frame-edge: #FFFFFF;
  --ink: #3A0D12;
  --muted: #7B5A5E;
  --red: #D9232C;
  --caption: #FFFFFF;
  --line: #CBD5D9;
  --danger: #FFD3D0;
  --hand: "Kalam", "Comic Sans MS", "Chalkboard SE", cursive;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--wine-deep); }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #5C111B 0%, var(--wine) 45%, var(--wine-deep) 100%);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(36px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  position: relative;
}
/* Bokeh lights, like the photo's background */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 88% 8%,  rgba(255,90,80,.55) 0 22px, transparent 40px),
    radial-gradient(circle at 12% 22%, rgba(255,70,70,.35) 0 14px, transparent 30px),
    radial-gradient(circle at 78% 38%, rgba(255,120,90,.30) 0 34px, transparent 60px),
    radial-gradient(circle at 6% 62%,  rgba(255,80,80,.40) 0 26px, transparent 48px),
    radial-gradient(circle at 94% 72%, rgba(255,60,60,.35) 0 18px, transparent 36px),
    radial-gradient(circle at 30% 92%, rgba(255,100,90,.30) 0 40px, transparent 70px),
    radial-gradient(circle at 60% 14%, rgba(255,200,150,.9) 0 2px, transparent 4px),
    radial-gradient(circle at 22% 46%, rgba(255,200,150,.9) 0 2px, transparent 4px),
    radial-gradient(circle at 84% 54%, rgba(255,200,150,.9) 0 2px, transparent 4px),
    radial-gradient(circle at 44% 78%, rgba(255,200,150,.9) 0 2px, transparent 4px),
    radial-gradient(circle at 70% 88%, rgba(255,200,150,.9) 0 2px, transparent 4px),
    radial-gradient(circle at 8% 8%,   rgba(255,200,150,.9) 0 2px, transparent 4px);
  filter: blur(1px);
}
.wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.head { color: var(--caption); display: flex; flex-direction: column; gap: 14px; }
.turma-foto { display: block; width: 100%; height: auto; max-width: 100%; border-radius: 14px; border: 3px solid var(--frame-edge); box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.head h1 { font: 700 clamp(34px, 10vw, 48px)/1 var(--hand); margin: 0; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.18); }

/* Photo-frame blocks */
.frame {
  background: var(--frame);
  border: 3px solid var(--frame-edge);
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.caption { font: 400 17px/1.2 var(--hand); color: var(--caption); text-align: center; margin: 8px 0 0; }

.facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.7fr); gap: 12px; margin: 0; }
.fact { min-width: 0; margin: 0; display: flex; flex-direction: column; }
.fact .frame { flex: 1; margin: 0; padding: 14px 8px; text-align: center; min-height: 92px; display: flex; flex-direction: column; justify-content: center; }
.fact .caption { margin: 8px 0 0; }
.fact .v { font: 800 20px/1.1 var(--body); color: var(--ink); }
.fact .s { font: 600 13px/1.25 var(--body); color: var(--muted); margin-top: 4px; }

/* Form */
form { display: flex; flex-direction: column; gap: 22px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.q { font: 700 24px/1.15 var(--hand); color: var(--caption); margin: 0; padding: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

/* Class grid: one frame per child, name underneath like the photo */
.turma { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 10px; }
.kid { position: relative; min-width: 0; text-align: center; }
.kid input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 2; }
.kid .frame {
  aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px;
  display: grid; place-items: center;
  font: 700 26px/1 var(--hand); color: var(--red);
  transition: transform .15s, box-shadow .15s, background .15s;
}
.kid .name { display: block; font: 400 14px/1.15 var(--hand); color: var(--caption); margin-top: 6px; overflow-wrap: anywhere; }
.kid input:checked + .frame { background: var(--red); color: #fff; transform: translateY(-2px) rotate(-1.5deg); box-shadow: 0 0 0 3px #fff, 0 10px 22px rgba(0,0,0,.35); }
.kid input:focus-visible + .frame { outline: 3px solid #FFD27A; outline-offset: 3px; }

.panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; color: var(--ink); }
label.field .opt { font-weight: 400; color: var(--muted); }
input[type=text] {
  font: 400 17px/1.3 var(--body); color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
  padding: 12px 14px; width: 100%;
}
input[type=text]:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(217,35,44,.2); }

.choices { display: grid; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 2; }
.choice .frame {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; font: 800 17px/1.2 var(--body); color: var(--ink);
  transition: background .15s, color .15s;
}
.choice .frame::before {
  content: ""; width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--line); background: #fff; flex: none;
}
.choice input:checked + .frame { background: var(--red); color: #fff; }
.choice input:checked + .frame::before { border-color: #fff; background: var(--red); box-shadow: inset 0 0 0 4px #fff; }
.choice input:focus-visible + .frame { outline: 3px solid #FFD27A; outline-offset: 3px; }

.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper-row + .stepper-row { border-top: 1px solid var(--line); padding-top: 12px; }
.stepper-row .lbl { min-width: 0; }
.stepper-row .lbl b { display: block; font-size: 17px; color: var(--ink); }
.stepper-row .lbl small { color: var(--muted); font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: var(--red); color: #fff;
  font: 800 22px/1 var(--body); cursor: pointer;
}
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper button:focus-visible { outline: 3px solid #FFD27A; outline-offset: 2px; }
.stepper output { width: 40px; text-align: center; font: 800 24px/1 var(--body); color: var(--ink); font-variant-numeric: tabular-nums; }

.submit {
  font: 700 24px/1 var(--hand);
  background: var(--red); color: #fff;
  border: 3px solid #fff; border-radius: 16px;
  padding: 16px; cursor: pointer; width: 100%;
  box-shadow: 0 8px 20px rgba(0,0,0,.3);
}
.submit:disabled { opacity: .6; cursor: progress; }
.submit:focus-visible { outline: 3px solid #FFD27A; outline-offset: 3px; }
.error { color: var(--danger); font-weight: 700; margin: 0; }
.foot { color: rgba(255,255,255,.7); font-size: 13px; text-align: center; margin: -8px 0 0; }

/* Thanks */
.thanks { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.thanks h2 { font: 700 32px/1 var(--hand); color: var(--red); margin: 0; }
.thanks p { margin: 0; color: var(--ink); }
.summary { background: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <img class="turma-foto" src="assets/turma.jpg" width="1400" height="981" alt="Foto da turma do Year 4 2026">
    <h1>Confra de fim de ano</h1>
  </header>

  <dl class="facts">
    <div class="fact"><dd class="frame"><span class="v">30/11</span><span class="s">segunda</span></dd><dt class="caption">Dia</dt></div>
    <div class="fact"><dd class="frame"><span class="v">18h</span></dd><dt class="caption">Hora</dt></div>
    <div class="fact"><dd class="frame"><span class="v">Salão Social</span><span class="s">Parque das Cascatas</span></dd><dt class="caption">Local</dt></div>
  </dl>

  <form id="form" novalidate>
    <fieldset class="block">
      <legend class="q">Quem é o seu filho(a)?</legend>
      <div class="turma" id="turma"></div>
    </fieldset>

    <fieldset class="block">
      <legend class="q">Vocês vão participar?</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="status" id="st-sim" value="sim"><span class="frame">Sim, vamos!</span></label>
        <label class="choice"><input type="radio" name="status" id="st-talvez" value="talvez"><span class="frame">Ainda não sei</span></label>
        <label class="choice"><input type="radio" name="status" id="st-nao" value="nao"><span class="frame">Não vamos conseguir</span></label>
      </div>
    </fieldset>

    <div class="block" id="quantos" hidden>
      <h2 class="q">Quantas pessoas vão?</h2>
      <div class="frame panel">
        <div class="stepper-row">
          <div class="lbl"><b>Adultos</b></div>
          <div class="stepper" data-field="adultos" data-min="0" data-max="10">
            <button type="button" data-step="-1" aria-label="Menos um adulto">−</button>
            <output id="adultos" aria-live="polite">1</output>
            <button type="button" data-step="1" aria-label="Mais um adulto">+</button>
          </div>
        </div>
        <div class="stepper-row">
          <div class="lbl"><b>Crianças</b><small>contando o(a) aluno(a)</small></div>
          <div class="stepper" data-field="criancas" data-min="0" data-max="10">
            <button type="button" data-step="-1" aria-label="Menos uma criança">−</button>
            <output id="criancas" aria-live="polite">1</output>
            <button type="button" data-step="1" aria-label="Mais uma criança">+</button>
          </div>
        </div>
        <label class="field" for="alergias">Alguma alergia ou restrição alimentar? <span class="opt">(opcional)</span>
          <input type="text" id="alergias" name="alergias" maxlength="200" placeholder="Ex.: sem lactose">
        </label>
      </div>
    </div>

    <p class="error" id="erro" role="alert" hidden></p>
    <button class="submit" type="submit" id="enviar">Enviar resposta</button>
    <p class="foot">As respostas ficam só com a organização da confra.</p>
  </form>

  <section class="frame thanks" id="obrigado" hidden aria-live="polite">
    <h2 id="obrigado-titulo">Obrigada!</h2>
    <p class="summary" id="obrigado-resumo"></p>
    <p id="obrigado-texto"></p>
  </section>

</main>

<script>
// URL do app da Web do Google Apps Script (Implantar > App da Web > termina em /exec)
const SCRIPT_URL = "__SCRIPT_URL__";

// Turma do Year 4 (sem as professoras). Nomes repetidos levam a inicial do sobrenome.
const TURMA = ["Alice", "Arthur", "Benjamin", "Daniel", "Davi", "Enzo", "Felipe", "Lorena",
               "Luisa", "Maria Fernanda", "Marina", "Régis", "Stella B.", "Stella W.", "Theo C.", "Theo G."];

const $ = (id) => document.getElementById(id);
const form = $("form");
const counts = { adultos: 1, criancas: 1 };

// Monta a grade da turma
const grid = $("turma");
TURMA.forEach((nome, i) => {
  const label = document.createElement("label");
  label.className = "kid";
  const input = document.createElement("input");
  input.type = "radio"; input.name = "aluno"; input.value = nome; input.id = "kid-" + i;
  const frame = document.createElement("span");
  frame.className = "frame"; frame.setAttribute("aria-hidden", "true");
  frame.textContent = nome.charAt(0);
  const name = document.createElement("span");
  name.className = "name"; name.textContent = nome;
  label.append(input, frame, name);
  grid.append(label);
});

function picked(name) {
  const el = form.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : null;
}

function syncSteppers() {
  document.querySelectorAll(".stepper").forEach((s) => {
    const f = s.dataset.field, min = +s.dataset.min, max = +s.dataset.max;
    $(f).textContent = counts[f];
    s.querySelector('[data-step="-1"]').disabled = counts[f] <= min;
    s.querySelector('[data-step="1"]').disabled = counts[f] >= max;
  });
}

document.querySelectorAll(".stepper").forEach((s) => {
  s.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-step]");
    if (!b) return;
    const f = s.dataset.field;
    counts[f] = Math.min(+s.dataset.max, Math.max(+s.dataset.min, counts[f] + Number(b.dataset.step)));
    syncSteppers();
  });
});

form.addEventListener("change", (e) => {
  if (e.target.name === "status") $("quantos").hidden = picked("status") === "nao";
});

function showError(msg) { $("erro").textContent = msg; $("erro").hidden = !msg; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("");
  const nome = picked("aluno");
  const st = picked("status");
  if (!nome) { showError("Toque no nome do seu filho(a)."); grid.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const aluno = nome;
  if (!st) { showError("Escolha se vocês vão participar."); return; }
  const vai = st !== "nao";
  if (vai && counts.adultos + counts.criancas === 0) { showError("Coloque pelo menos uma pessoa, ou escolha \"Não vamos conseguir\"."); return; }

  const payload = {
    aluno,
    status: st,
    adultos: vai ? counts.adultos : 0,
    criancas: vai ? counts.criancas : 0,
    alergias: vai ? ($("alergias").value.trim() || null) : null
  };

  const btn = $("enviar");
  btn.disabled = true; btn.textContent = "Enviando…";
  try {
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const res = await r.json();
    if (!res.ok) throw new Error("rejected");
    form.hidden = true;
    const total = payload.adultos + payload.criancas;
    $("obrigado-titulo").textContent = st === "nao" ? "Que pena!" : "Obrigada!";
    $("obrigado-resumo").textContent =
      st === "nao" ? aluno + ": não vão conseguir ir."
      : aluno + ": " + (st === "sim" ? "confirmado" : "talvez") + " · " +
        payload.adultos + (payload.adultos === 1 ? " adulto" : " adultos") + " e " +
        payload.criancas + (payload.criancas === 1 ? " criança" : " crianças") + " (" + total + " no total)";
    $("obrigado-texto").textContent =
      st === "sim" ? "Nos vemos dia 30/11 às 18h no Salão Social do Parque das Cascatas."
      : st === "talvez" ? "Anotamos como talvez."
      : "Obrigada por avisar.";
    $("obrigado").hidden = false;
    $("obrigado").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    showError("Não conseguimos enviar agora. Confira a internet e tente de novo.");
  } finally {
    btn.disabled = false; btn.textContent = "Enviar resposta";
  }
});

syncSteppers();
</script>
</body>
</html>
